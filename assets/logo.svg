        filter="url(#glow)" />
  <!-- Vault Inner Dial / Lock Ring -->
  <circle cx="24" cy="23" r="9" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="4 2" fill="#0f172a" fill-opacity="0.85" />
  <!-- Document Warranty Checkmark Facet -->
  <path d="M20 23L23 26L28 20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Star / Accent Dots -->
  <circle cx="24" cy="10" r="1.5" fill="#38bdf8" />
</svg>
